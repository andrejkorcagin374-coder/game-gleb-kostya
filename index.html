<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Глеб vs Костя - Битва мемов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .game-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .player {
            text-align: center;
        }

        .player-name {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .player-avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 3px solid #667eea;
        }

        .player1 .player-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
        }

        .player2 .player-avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-color: #f5576c;
        }

        .hp-bar {
            background: #e0e0e0;
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
            border: 2px solid #333;
        }

        .hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50 0%, #45a049 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            transition: width 0.3s ease;
        }

        .player2 .hp-fill {
            background: linear-gradient(90deg, #f5576c 0%, #f093fb 100%);
        }

        .hp-text {
            font-size: 0.9em;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }

        .energy {
            font-size: 1em;
            color: #666;
            margin-top: 8px;
        }

        .buttons-section {
            text-align: center;
            margin: 30px 0;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-attack {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
            color: white;
        }

        .btn-attack:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .btn-heal {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }

        .btn-heal:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .btn-special {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #333;
        }

        .btn-special:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }

        .btn-reset {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-reset:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .log {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            height: 120px;
            overflow-y: auto;
            border: 2px solid #ddd;
            font-size: 0.9em;
            color: #333;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #ddd;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-attack {
            color: #f5576c;
            font-weight: bold;
        }

        .log-heal {
            color: #4CAF50;
            font-weight: bold;
        }

        .log-special {
            color: #FFA500;
            font-weight: bold;
        }

        .game-status {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            margin: 20px 0;
            min-height: 30px;
        }

        .status-gleb {
            color: #667eea;
        }

        .status-kostya {
            color: #f5576c;
        }

        .damage-number {
            position: fixed;
            pointer-events: none;
            font-weight: bold;
            font-size: 1.5em;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            to {
                transform: translateY(-50px);
                opacity: 0;
            }
        }

        .damage-attack {
            color: #f5576c;
        }

        .damage-heal {
            color: #4CAF50;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .player-avatar {
                width: 80px;
                height: 80px;
                font-size: 2.5em;
            }

            .game-board {
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ Глеб vs Костя ⚔️</h1>

        <div class="game-board">
            <div class="player player1">
                <div class="player-name">Глеб 🧠</div>
                <div class="player-avatar">🧠</div>
                <div class="hp-bar">
                    <div class="hp-fill" id="hp1" style="width: 100%"></div>
                </div>
                <div class="hp-text" id="hp-text1">100 / 100 HP</div>
                <div class="energy" id="energy1">⚡ Энергия: 100</div>
            </div>

            <div class="player player2">
                <div class="player-name">Костя 💪</div>
                <div class="player-avatar">💪</div>
                <div class="hp-bar">
                    <div class="hp-fill" id="hp2" style="width: 100%"></div>
                </div>
                <div class="hp-text" id="hp-text2">100 / 100 HP</div>
                <div class="energy" id="energy2">⚡ Энергия: 100</div>
            </div>
        </div>

        <div class="buttons-section">
            <div class="game-status" id="status">Начни битву!</div>
            <div class="action-buttons">
                <button class="btn-attack" id="btn-attack">⚡ Атака</button>
                <button class="btn-special" id="btn-special">🔥 Спец. удар</button>
                <button class="btn-heal" id="btn-heal">💚 Исцеление</button>
                <button class="btn-reset" id="btn-reset">🔄 Новая игра</button>
            </div>
        </div>

        <div class="log" id="log"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
